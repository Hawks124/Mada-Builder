# Maintenance hebdo (lot B) — jobs applicatifs sans chemin planifié ailleurs.
#
# Regroupe : sweep R2 (orphelins) + abort multipart, purge notifications,
# purge OTP expirés, recomptage `download_count` (filet TS, la version SQL
# tourne déjà en pg_cron quotidien) et le DEAD MAN SWITCH revenus (le job
# horaire pourrait mourir en silence — une fois par semaine, le silence
# est brisé : 503 si le run est rouge).
#
# Convention crons du repo (.env.example) : POST /api/cron/* en Bearer.
# Secrets requis (repo Settings → Secrets → Actions) : SITE_URL, CRON_SECRET
# (mêmes secrets que digest-weekly / revenue-sync). Sweep compose d'un
# double-run (recomptage idempotent, purges sans effet vide) — pas de
# garde-fou nécessaire, contrairement au digest.
name: maintenance-weekly

on:
  schedule:
    - cron: "43 3 * * 6"
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Maintenance hebdo
        run: |
          code=$(curl -s --max-time 300 -o /tmp/maintenance.json -w "%{http_code}" -X POST \
            "$SITE_URL/api/cron/maintenance" \
            -H "Authorization: Bearer $CRON_SECRET")
          cat /tmp/maintenance.json
          test "$code" = "200"
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
