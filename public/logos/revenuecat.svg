<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" aria-label="RevenueCat">
  <circle cx="24" cy="24" r="24" fill="#F5820D"/>
  <!-- Cat ears -->
  <polygon points="8,6 16,20 2,20" fill="white" opacity="0.9"/>
  <polygon points="40,6 46,20 32,20" fill="white" opacity="0.9"/>
  <!-- Cat face circle -->
  <circle cx="24" cy="28" r="16" fill="white" opacity="0.95"/>
  <!-- Eyes -->
  <ellipse cx="18" cy="26" rx="2.5" ry="3" fill="#F5820D"/>
  <ellipse cx="30" cy="26" rx="2.5" ry="3" fill="#F5820D"/>
  <!-- Nose -->
  <polygon points="24,30 22,33 26,33" fill="#F5820D"/>
  <!-- Whiskers -->
  <line x1="10" y1="30" x2="20" y2="31" stroke="#F5820D" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="10" y1="33" x2="20" y2="33" stroke="#F5820D" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="28" y1="31" x2="38" y2="30" stroke="#F5820D" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="28" y1="33" x2="38" y2="33" stroke="#F5820D" stroke-width="1.2" stroke-linecap="round"/>
</svg>
